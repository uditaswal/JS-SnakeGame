<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Play the classic Snake Game with modern UI and mobile support" />
  <meta name="theme-color" content="#6BAE3F" />
  <link rel="stylesheet" href="style.css?v=5" />
  <link rel="icon" href="img/thumbnail.png" />
  <script src="script.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Madimi+One:wght@400&display=swap" rel="stylesheet" />
  <title>Snake Game - Play</title>
</head>

<body>
  <div class="game-wrapper">
    <div class="control-panel buttons">
      <a href="pausePage.html"><button type="button" id="pausebtn">Pause</button></a>
      <button type="button" id="resetbtn" onclick="resetGame()">Reset</button>
      <button type="button" id="scorebtn">Score: 0</button>
      <button type="button" id="timer">0 : 00 : 00</button>
      <img id="soundImg" src="img/mute-button.png" onclick="gameAudio.pause()" alt="Sound Toggle" />
    </div>
    <div class="game-area">
      <div class="imgContainer" id="imgContainer"></div>
    </div>
  </div>
</body>

</html>
